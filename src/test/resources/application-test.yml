spring:
    application:
        name: yogerOrder

    jpa:
        hibernate:
            ddl-auto: create
        properties:
            hibernate:
                format_sql: true
        open-in-view: false

    threads:
        virtual:
            enabled: true

port-one:
    v1:
        APIKey: ${V1_APIKEY}
        APISecret: ${V1_APISECRET}
    v2:
        APISecret: ${V2_APISECRET}

order:
    valid-time: 5
    cron:
        expiration: '0 0/1 * * * *'

global:
    timeZone: 'Asia/Seoul'

logging:
    level:
        org.library.yogerLibrary.log: DEBUG

kafka:
    producer:
        enable-idempotence: true
        transaction-id-prefix: tx-
    consumer:
        auto-offset-reset: earliest
        enable-auto-commit: false
        isolation-level: read_committed
