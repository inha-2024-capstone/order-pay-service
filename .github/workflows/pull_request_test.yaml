name: PR Test

on:
    pull_request_target:
        branches:
            - develop

jobs:
    test:
        permissions:
            pull-requests: write
            checks: write
            contents: read

        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4.2.2
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Set up JDK 21
              uses: actions/setup-java@v4.7.0
              with:
                  java-version: '21'
                  distribution: 'corretto'

            - name: Get secrets
              env:
                  V1_APIKEY: ${{ secrets.V1_APIKEY }}
                  V1_APISECRET: ${{ secrets.V1_APISECRET }}
                  V2_APISECRET: ${{ secrets.V2_APISECRET }}
              run: |
                  echo "V1_APIKEY=$V1_APIKEY" >> .env
                  echo "V1_APISECRET=$V1_APISECRET" >> .env
                  echo "V2_APIKEY=$V2_APIKEY" >> .env

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Test with Gradle
              run: ./gradlew --info test

                # Test 후 Report 생성
            - name: Publish Test Results
              uses: EnricoMi/publish-unit-test-result-action@v2
              if: always()
              with:
                  junit_files: '**/build/test-results/test/TEST-*.xml'